turntable_joy_node:
  ros__parameters:
    # Jog settings
    jog_speed_deg_per_sec: 30.0
    publish_rate: 20.0

    # The jog buttons and the deadman are controller-specific: they are in
    # the controller profile (xbox_controller.yaml, 8bitdo_pro2.yaml), which
    # the launch file loads after this file.
    # No joystick message for this long: stop jogging.
    joy_timeout: 0.5

    # ROS topics
    joy_topic: "/joy"
    # Where the jog target is seeded from: the turntable's own topic, which
    # exists only once its ESP32 reports. /joint_states says 0.0 until then.
    joint_states_topic: "/turntable/joint_states"
    command_topic: "/turntable_forward_position_controller/commands"

    # Controller manager
    switch_controller_service: "/controller_manager/switch_controller"
    list_controllers_service: "/controller_manager/list_controllers"
    position_controller: "turntable_forward_position_controller"
    trajectory_controller: "turntable_trajectory_controller"

    # Joint (prefixed name in inspection cell context)
    joint_name: "turntable_disc_joint"
