# Admittance control (admittance_control_node): the Tier 3 coupled-pendulum plant,
# fed by the orientation node's wrench + pivot topics.
admittance_control:
  ros__parameters:
    # Publishing rate (Hz). Feeds Servo's 500 Hz loop; kept high so the twist
    # command isn't a 10 Hz staircase that Servo's finite-difference velocity
    # output turns into jitter on the forward_velocity_controller.
    publish_rate: 250.0

    # The virtual sphere (the plant), set here ONLY: this node publishes it,
    # latched, on /admittance_control/virtual_sphere, and the orientation
    # controller and autofocus place their gains on what it publishes. Change
    # it live with `ros2 param set /admittance_control sphere_mass ...`. All > 0.
    sphere_mass: 2.5      # kg
    sphere_radius: 0.65   # m
    fluid_viscosity: 1.0  # Pa·s

    # Frame ID for the twist messages (must match the orientation node's
    # main_camera_frame, since pivot r is published in that frame).
    frame_id: "eoat_camera_link"

    # Topic names
    teleop_wrench_topic: "/teleop/wrench_cmds"
    # Tier 3: subscribe to the coupled-pendulum orientation node (pure torque wrench).
    orientation_wrench_topic: "/orientation_controller/wrench_cmds"
    autofocus_wrench_topic: "/autofocus/wrench_cmds"
    servo_twist_topic: "/servo_node/delta_twist_cmds"

    # Tier 3 coupled pendulum: pivot lever arm r (= camera - A) + staleness timeout.
    pivot_topic: "/orientation_controller/pivot_r"
    pivot_timeout: 0.2

    # Speed clamps on the plant's output twist, per axis (0 = off). Full stick
    # settles at about 0.05 m/s and 0.2 rad/s with this mass and drag, so these
    # only catch runaways (e.g. a large controller wrench). The remote teleop
    # gate lowers them while a remote operator is driving.
    max_linear_speed: 0.25   # m/s
    max_angular_speed: 0.8   # rad/s

    # A teleop wrench older than this counts as zero (teleop stopped publishing).
    teleop_timeout: 0.5      # s

    # Deadman from teleop: no wrench applies at all (teleop, orientation
    # control, autofocus) unless this is true, i.e. the deadman is held and the
    # joystick drives this arm, and newer than deadman_timeout. Released, the
    # plant coasts to rest on its drag. Empty topic = no deadman.
    deadman_topic: "/teleop/deadman"
    deadman_timeout: 0.5     # s
