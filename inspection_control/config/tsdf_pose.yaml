tsdf_pose:
  ros__parameters:
    # -- Frames --
    fusion_frame: "object_frame"      # frame in which the TSDF is built
    world_frame:  "world"             # pose is published in this frame
    model_frame:  "model_frame"       # TF child frame for the registered model
    publish_tf:   true                # also broadcast world->model_frame TF

    # -- TSDF integration (Open3D VoxelBlockGrid) --
    voxel_size:                 0.003     # m
    sdf_trunc_mult:             4.0       # sdf_trunc = mult * voxel_size
    block_resolution:           16
    block_count:                10000
    integration_device:         "CUDA:0"   # "CUDA:0" if Open3D was built with CUDA
    integrate_every_n_frames:   1

    # -- Depth sensor --
    depth_min:                  0.07      # m – D405 min usable range
    depth_max:                  0.50      # m – D405 max usable range
    depth_max_integration:      0.50      # m – TSDF truncates beyond this

    # -- Registration cadence --
    registration_enabled:       false
    register_every_n_frames:    30        # ICP refinement period (frames)
    min_integrations_before_register: 10  # need enough fused surface first

    # -- Extracted surface point cloud --
    extract_weight_threshold:   10.0       # only points with weight >= this are extracted

    # -- Fused-cloud crop (axis-aligned box in fusion_frame, metres) --
    crop_enabled:               true
    crop_min:                   [-0.5, -0.5, 0.00]   # x, y, z lower bound
    crop_max:                   [0.5,  0.5,  1.0]    # x, y, z upper bound

    # -- Turntable-plane removal (RANSAC in fusion_frame) --
    remove_turntable:           true
    plane_distance_mult:        2.0     # RANSAC inlier dist = mult * voxel_size
    plane_ransac_iterations:    200
    plane_min_verticality:      0.9     # |n_z| after normalising; reject tilted planes
    plane_min_inliers:          200     # min inliers to accept a plane as the table
    plane_margin:               0.002   # m – also drop points within this margin above it
    plane_refit_every:          5       # re-run RANSAC every N extractions (cache between)

    # -- Reference cloud sampled from the CAD mesh --
    reference_sample_points:    50000     # Poisson-disk points sampled from the mesh surface

    # -- Registration: downsampling --
    fused_voxel_size:           0.003     # m – downsample fused cloud
    reference_voxel_size:       0.003     # m – downsample reference CAD cloud

    # -- Registration: features --
    normal_radius_mult:         2.0       # * voxel_size for normal estimation
    fpfh_radius_mult:           5.0       # * voxel_size for FPFH descriptor

    # -- Registration: RANSAC (global init) --
    ransac_distance_mult:       1.5       # * voxel_size
    ransac_max_iterations:      100000
    ransac_confidence:          0.999

    # -- Registration: ICP (refinement) --
    icp_distance_mult:          1.5       # * voxel_size
    icp_max_iterations:         50
    icp_fitness_min:            0.3       # reject result below this fitness

    # -- External --
    viewpoint_generation_node: "viewpoint_generation"

    # -- Topics --
    pose_topic:             "tsdf_pose/pose"
    fused_cloud_topic:      "tsdf_pose/fused_cloud"
    synthetic_depth_topic:  "tsdf_pose/depth/synthetic"
    model_marker_topic:     "tsdf_pose/model_marker"

    # -- Macro-perspective surface-normal producer --
    # Raycasts the macro (pi) camera's optical axis against the TSDF volume / CAD
    # mesh and publishes tsdf_pose/surface_normal (+TF), tsdf_pose/focal_distance_m,
    # and tsdf_pose/depth/macro_synthetic.
    enable_surface_normal:      true
    surface_normal_rate_hz:     10.0
    macro_camera_frame:         "eoat_camera_link"
    macro_camera_info_topic:    "/pi_camera/camera_info"
    # IMPORTANT: /pi_camera/camera_info is UNCALIBRATED (publishes width=0, height=0,
    # k=all-zeros), so the intrinsics MUST be supplied here or the producer no-ops.
    # Fill these from the pi camera's real resolution + focal length in PIXELS:
    #   fx = fy = width_px / (2 * tan(HFOV/2))   (square pixels: fx == fy)
    #   cx, cy default to the image centre when left 0.
    macro_fx:                   0.0     # <-- SET ME (pixels)
    macro_fy:                   0.0     # <-- SET ME (pixels)
    macro_cx:                   0.0     # 0 => width/2
    macro_cy:                   0.0     # 0 => height/2
    macro_width:                0       # <-- SET ME (px)
    macro_height:               0       # <-- SET ME (px)
    # Raycast render + range. If the throttled log reports the block depth span is
    # beyond this range, raise raycast_depth_max to the macro standoff.
    raycast_downscale:          4
    raycast_depth_min:          0.05    # m
    raycast_depth_max:          0.60    # m
    publish_synthetic_macro_depth: true

    # -- Surface-target-frame image annotations --
    # foxglove_msgs/ImageAnnotations on tsdf_pose/annotations: the surface target
    # frame as an XYZ = RGB axis triad at the centre of the macro image. Overlay it
    # on the macro camera feed in a Foxglove Image panel (pixel coords are the
    # full-resolution macro image, i.e. macro_width x macro_height).
    publish_frame_annotations:  true
    annotation_axis_length_px:  60.0
    annotation_thickness:       3.0
    annotation_labels:          true
